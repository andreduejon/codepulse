name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  BUN_VERSION: "1.4.3"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release version
        if: ${{ github.event_name == 'push' }}
        run: test "v$(bun -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Check types
        run: bun run check:types

      - name: Check (lint + format)
        run: bun run check

      - name: Run tests
        run: bun test

  build:
    needs: verify
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: darwin
            arch: arm64
            runner: macos-14
          - target: darwin-x64
            os: darwin
            arch: x64
            runner: macos-15-intel
          - target: linux-arm64
            os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            os: linux
            arch: x64
            runner: ubuntu-latest
          - target: windows-x64
            os: win32
            arch: x64
            runner: windows-latest
          - target: windows-arm64
            os: win32
            arch: arm64
            runner: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --os=${{ matrix.os }} --cpu=${{ matrix.arch }}

      - name: Verify native Windows architecture
        if: ${{ matrix.os == 'win32' }}
        run: bun -e 'if (process.arch !== "${{ matrix.arch }}") process.exit(1)'

      - name: Native tests
        timeout-minutes: 3
        run: bun test

      - name: Installer regression checks
        run: bun scripts/test-install.ts

      - name: Build standalone executable
        env:
          CODEPULSE_BUILD_TARGET: bun-${{ matrix.target }}
          CODEPULSE_BUILD_ASSET_SMOKE: "1"
        run: bun run build

      - name: Sign macOS executables
        if: ${{ matrix.os == 'darwin' }}
        run: |
          codesign --force --sign - --entitlements scripts/macos-entitlements.plist "dist/${{ matrix.target }}/codepulse"
          codesign --force --sign - --entitlements scripts/macos-entitlements.plist "dist/${{ matrix.target }}/smoke-opentui-assets"
          codesign --verify --verbose=4 "dist/${{ matrix.target }}/codepulse"
          codesign --verify --verbose=4 "dist/${{ matrix.target }}/smoke-opentui-assets"

      - name: Smoke-test executable and embedded assets
        if: ${{ matrix.os != 'win32' }}
        shell: bash
        run: |
          binary="$GITHUB_WORKSPACE/dist/${{ matrix.target }}/codepulse"
          asset_smoke="$GITHUB_WORKSPACE/dist/${{ matrix.target }}/smoke-opentui-assets"
          test "$("$binary" --version)" = "codepulse v$(bun -p "require('./package.json').version")"
          "$binary" --help
          "$asset_smoke"
          bun scripts/smoke-binary.ts "$binary" "$GITHUB_WORKSPACE"

      - name: Smoke-test Windows executable and embedded assets
        if: ${{ matrix.os == 'win32' }}
        run: |
          $binary = './dist/${{ matrix.target }}/codepulse.exe'
          $expected = 'codepulse v' + (Get-Content package.json -Raw | ConvertFrom-Json).version
          $actual = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw "Version smoke failed: $actual" }
          & $binary --help
          if ($LASTEXITCODE -ne 0) { throw 'Help smoke failed' }
          & './dist/${{ matrix.target }}/smoke-opentui-assets.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Embedded asset smoke failed' }
          bun scripts/smoke-binary.ts $binary $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Interactive executable smoke failed' }

      - name: Create release archive
        if: ${{ matrix.os != 'win32' }}
        run: tar -C "dist/${{ matrix.target }}" -czf "codepulse-${{ matrix.target }}.tar.gz" codepulse

      - name: Create manual Unix test archive
        if: ${{ github.event_name == 'workflow_dispatch' && matrix.os != 'win32' }}
        run: tar -C "dist/${{ matrix.target }}" -czf "test-${{ matrix.target }}.tar.gz" codepulse smoke-opentui-assets

      - name: Create Windows release archive
        if: ${{ matrix.os == 'win32' }}
        run: Compress-Archive -Path 'dist/${{ matrix.target }}/codepulse.exe' -DestinationPath 'codepulse-${{ matrix.target }}.zip'

      - name: Create manual Windows test archive
        if: ${{ github.event_name == 'workflow_dispatch' && matrix.os == 'win32' }}
        run: Compress-Archive -Path 'dist/${{ matrix.target }}/*.exe' -DestinationPath 'test-${{ matrix.target }}.zip'

      - name: Upload manual test archive
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ matrix.target }}
          path: test-${{ matrix.target }}.*
          if-no-files-found: error

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: codepulse-${{ matrix.target }}
          path: codepulse-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: codepulse-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum codepulse-*.tar.gz codepulse-*.zip > SHA256SUMS

      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* install.sh install.ps1 --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* install.sh install.ps1 \
              --draft \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
