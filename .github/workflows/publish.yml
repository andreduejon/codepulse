name: Release

on:
  push:
    tags: ["v*"]

env:
  BUN_VERSION: "1.3.14"

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release version
        run: test "v$(bun -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Check types
        run: bun run check:types

      - name: Check (lint + format)
        run: bun run check

      - name: Run tests
        run: bun test

  build:
    needs: verify
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: darwin
            arch: arm64
            runner: macos-14
          - target: darwin-x64
            os: darwin
            arch: x64
            runner: macos-15-intel
          - target: linux-arm64
            os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            os: linux
            arch: x64
            runner: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --os=${{ matrix.os }} --cpu=${{ matrix.arch }}

      - name: Install smoke-test tools
        if: ${{ matrix.os == 'linux' }}
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Build standalone executable
        env:
          CODEPULSE_BUILD_TARGET: bun-${{ matrix.target }}
          CODEPULSE_BUILD_ASSET_SMOKE: "1"
        run: bun run build

      - name: Sign macOS executables
        if: ${{ matrix.os == 'darwin' }}
        run: |
          codesign --force --sign - --entitlements scripts/macos-entitlements.plist "dist/${{ matrix.target }}/codepulse"
          codesign --force --sign - --entitlements scripts/macos-entitlements.plist "dist/${{ matrix.target }}/smoke-opentui-assets"
          codesign --verify --verbose=4 "dist/${{ matrix.target }}/codepulse"
          codesign --verify --verbose=4 "dist/${{ matrix.target }}/smoke-opentui-assets"

      - name: Smoke-test executable and embedded assets
        shell: bash
        run: |
          binary="$GITHUB_WORKSPACE/dist/${{ matrix.target }}/codepulse"
          asset_smoke="$GITHUB_WORKSPACE/dist/${{ matrix.target }}/smoke-opentui-assets"
          test "$("$binary" --version)" = "codepulse v$(bun -p "require('./package.json').version")"
          "$asset_smoke"
          expect scripts/smoke-binary.exp "$binary" "$GITHUB_WORKSPACE"

      - name: Create release archive
        run: tar -C "dist/${{ matrix.target }}" -czf "codepulse-${{ matrix.target }}.tar.gz" codepulse

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: codepulse-${{ matrix.target }}
          path: codepulse-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum codepulse-*.tar.gz > SHA256SUMS

      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* install.sh --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* install.sh \
              --draft \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
