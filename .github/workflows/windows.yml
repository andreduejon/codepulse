name: Windows validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    env:
      BUN_VERSION: "1.4.3"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Verify native architecture
        shell: pwsh
        run: |
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().ToLowerInvariant()
          if ($actual -ne '${{ matrix.arch }}') { throw "Expected native ${{ matrix.arch }} process, got $actual" }
          bun -e 'if (process.arch !== "${{ matrix.arch }}") process.exit(1)'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check types and formatting
        shell: pwsh
        run: |
          bun run check:types
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: HTTP concurrency diagnostic
        timeout-minutes: 2
        run: bun test tests/shared-http.test.ts
      - name: Native tests
        timeout-minutes: 3
        run: bun test
      - name: Installer regression checks
        shell: pwsh
        run: ./scripts/test-install-windows.ps1
      - name: Build standalone executables
        env:
          CODEPULSE_BUILD_TARGET: bun-windows-${{ matrix.arch }}
          CODEPULSE_BUILD_ASSET_SMOKE: "1"
        run: bun run build
      - name: Native executable and embedded asset smoke
        shell: pwsh
        run: |
          $binary = './dist/windows-${{ matrix.arch }}/codepulse.exe'
          $expected = 'codepulse v' + (Get-Content package.json -Raw | ConvertFrom-Json).version
          $actual = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw "Version smoke failed: $actual" }
          & $binary --help
          if ($LASTEXITCODE -ne 0) { throw 'Help smoke failed' }
          & './dist/windows-${{ matrix.arch }}/smoke-opentui-assets.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Embedded asset smoke failed' }
      - name: Package release and interactive-test archives
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/windows-${{ matrix.arch }}/codepulse.exe' -DestinationPath 'codepulse-windows-${{ matrix.arch }}.zip'
          Compress-Archive -Path 'dist/windows-${{ matrix.arch }}/*.exe', 'docs/WINDOWS-TESTING.md' -DestinationPath 'test-windows-${{ matrix.arch }}.zip'
      - uses: actions/upload-artifact@v7
        with:
          name: codepulse-windows-${{ matrix.arch }}
          path: codepulse-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: test-windows-${{ matrix.arch }}
          path: test-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
